name: check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/site-test.sh
      - run: bash tests/site-test-selftest.sh

  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/layout-test.mjs
